[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "synced_ereader_api"
version = "1.0.0"
requires-python = ">=3.11,<4"  # Raised from >=3.10 to leverage improved perf & typing in 3.11
dependencies = [
    "Flask>=3.0.2,<4",
    # Audio transcription and model
    "openai-whisper",
    # Media playback / control
    "python-vlc",
    # Audio segment processing
    "pynput",
    "python-dotenv",
    "scikit-learn",
    "flask-cors",
    "pydub",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "flake8>=7,<8",
    "black>=24.2.0,<25",
    "isort>=5.13.1,<6",
    "mypy>=1.8.0,<2",
]

[tool.setuptools.package-data]
"*" = ["**/static/**/*", "**/templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
files = "synced_ereader_api,tests"
